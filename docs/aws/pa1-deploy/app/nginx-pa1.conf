# Nginx tren may HN: phuc vu FE (file tinh) va chuyen API sang BE Spring Boot (cong 8080).
# BE cua nhom nhan URL dang /{site}/api/v1/... voi site = hn | dn | hcm (BranchRoutingFilter),
# va /health. FE goi API bang duong dan tuong doi, vd fetch('/dn/api/v1/...').
server {
    listen 80 default_server;
    server_name _;

    root /var/www/pa1;
    index index.html;

    # API -> BE
    location ~ ^/(hn|dn|hcm)/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # FE kieu SPA (React/Vue/Angular): moi duong dan khong phai file -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
